services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video-tagger-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - API_KEY=${API_KEY:-test_dev_key}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/storage/tagger.db}
      - DATASET_DIR=/app/dataset
      - BASE_STORAGE_DIR=/app/storage
      - TEMP_DIR=/app/storage/temp
      - ALLOW_LOCAL_NETWORK=${ALLOW_LOCAL_NETWORK:-false}
      - CELERY_ENABLED=false
    volumes:
      - dataset_data:/app/dataset
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tagger-network

networks:
  tagger-network:
    driver: bridge

volumes:
  dataset_data:
  storage_data:
