<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        
        /* Layout */
        .layout { display: flex; height: 100vh; flex-direction: column; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background-color: #1e293b; border-right: 1px solid #334155; overflow-y: auto; display: flex; flex-direction: column; }
        .folder-item { padding: 10px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-left: 3px solid transparent; user-select: none; }
        .folder-item:hover { background-color: #334155; }
        .folder-item.active { background-color: #0ea5e920; border-left-color: #0ea5e9; }
        
        /* File Grid */
        .file-explorer { flex: 1; display: flex; flex-direction: column; background-color: #0f172a; }
        .file-grid { flex: 1; overflow-y: auto; padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; align-content: start; }
        
        /* File Item */
        .file-item { 
            background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; overflow: hidden; cursor: pointer; user-select: none;
            transition: transform 0.1s, border-color 0.1s, box-shadow 0.1s;
        }
        .file-item:hover { border-color: #64748b; }
        .file-item.selected { border-color: #0ea5e9; background-color: #0ea5e920; box-shadow: 0 0 0 1px #0ea5e9; }
        
        /* Context Menu */
        .context-menu { position: absolute; background-color: #1e293b; border: 1px solid #334155; border-radius: 6px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); z-index: 100; min-width: 180px; padding: 6px 0; display: none; }
        .context-menu-item { padding: 8px 16px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: #e2e8f0; }
        .context-menu-item:hover { background-color: #334155; }
        .context-menu-item.danger { color: #f43f5e; }
        .context-menu-item.danger:hover { background-color: #f43f5e20; }
        .context-divider { height: 1px; background-color: #334155; margin: 4px 0; }
        
        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background-color: rgba(15, 23, 42, 0.9); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 100%; max-width: 500px; padding: 24px; }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Header -->
        <header class="bg-slate-900 border-b border-slate-800 h-14 flex items-center justify-between px-4 shrink-0 shadow-sm z-10">
            <div class="flex items-center gap-3">
                <div class="w-7 h-7 rounded bg-gradient-to-br from-sky-500 to-blue-600 flex items-center justify-center font-bold text-white text-xs">V</div>
                <h1 class="text-lg font-semibold text-slate-200">Dataset Explorer</h1>
            </div>
            <div class="flex items-center gap-4">
                <div id="statusText" class="text-xs font-medium text-slate-400">Loading...</div>
                <button onclick="fetchDataset()" class="text-slate-400 hover:text-white p-1 rounded" title="Refresh">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </header>

        <div class="main-container">
            <!-- Sidebar (Folders) -->
            <aside class="sidebar" id="sidebar">
                <div class="text-xs font-semibold text-slate-500 tracking-wider uppercase px-4 py-3 border-b border-slate-800">Labels / Categories</div>
                <div id="folderList" class="flex-1 overflow-y-auto py-2">
                    <!-- Folders render here -->
                </div>
            </aside>

            <!-- Main File Area -->
            <main class="file-explorer" id="fileExplorer" tabindex="0">
                <!-- Toolbar -->
                <div class="h-12 bg-slate-800/50 border-b border-slate-800 flex items-center px-6 justify-between shrink-0">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 text-sky-400" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                        <span id="currentFolderName" class="font-semibold text-slate-200">Select a folder</span>
                    </div>
                    <div class="text-xs text-slate-400" id="selectionStatus"></div>
                </div>

                <!-- Grid -->
                <div class="file-grid" id="fileGrid" onclick="clearSelection(event)">
                    <!-- Files render here -->
                    <div class="col-span-full flex flex-col items-center justify-center h-full text-slate-500 mt-20">
                        <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        <p>Select a label from the sidebar to view files</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Custom Context Menu -->
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" onclick="handleMenuAction('preview')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Play / Preview
        </div>
        <div class="context-divider"></div>
        <div class="context-menu-item" onclick="handleMenuAction('move')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            Move / Rename
        </div>
        <div class="context-menu-item" onclick="handleMenuAction('download')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Download
        </div>
        <div class="context-divider"></div>
        <div class="context-menu-item danger" onclick="handleMenuAction('delete')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            Delete
        </div>
    </div>

    <!-- Move/Rename Modal -->
    <div id="moveModal" class="modal-overlay">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="moveModalTitle" class="text-lg font-bold mb-5 text-white">Move / Rename</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Destination Label (Folder)</label>
                    <input id="modalCategory" type="text" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-white focus:border-sky-500 outline-none">
                </div>
                <div id="renameContainer">
                    <label class="block text-sm font-medium text-slate-400 mb-1">New Filename</label>
                    <input id="modalFilename" type="text" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-white focus:border-sky-500 outline-none">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeMoveModal()" class="px-4 py-2 rounded bg-slate-700 hover:bg-slate-600 text-sm">Cancel</button>
                <button onclick="submitMove()" class="px-4 py-2 rounded bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium">Apply</button>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal-overlay">
        <div class="bg-slate-800 border border-slate-700 rounded-lg shadow-2xl w-full max-w-4xl overflow-hidden" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center p-3 border-b border-slate-700 bg-slate-900">
                <h3 id="previewTitle" class="text-sm font-medium text-slate-200 truncate"></h3>
                <button onclick="closePreview()" class="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="aspect-video bg-black relative">
                <video id="previewVideo" class="w-full h-full" controls controlsList="nodownload"></video>
            </div>
        </div>
    </div>

    <script>
        let currentDataset = [];
        let currentCategory = null;
        
        let selectedIndices = new Set();
        let lastSelectedIndex = null; // For Shift+Click

        // Lazy loading videos
        const videoObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const video = entry.target;
                    if (video.dataset.src) {
                        video.src = video.dataset.src;
                        video.removeAttribute('data-src');
                    }
                    observer.unobserve(video);
                }
            });
        }, { rootMargin: "100px" });

        // Format Utilities
        function formatLabelName(id) {
            if (!id) return "Unknown";
            
            
            return id.replace(/[-_]/g, ' ').replace(/\b\w/g, w => w.toUpperCase());
        }
        function formatBytes(bytes) {
            if (!+bytes) return '0 B';
            const k = 1024, i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(2))} ${['B', 'KB', 'MB', 'GB'][i]}`;
        }

        // Fetch Data
        async function fetchDataset() {
            try {
                const res = await fetch('/api/v1/dataset/');
                const data = await res.json();
                currentDataset = data.categories || [];
                
                let totalVids = 0, totalSize = 0;
                currentDataset.forEach(cat => {
                    totalVids += cat.videos.length;
                    totalSize += cat.videos.reduce((a, v) => a + v.size, 0);
                });
                document.getElementById('statusText').innerText = `${currentDataset.length} Folders | ${totalVids} Items | ${formatBytes(totalSize)}`;
                
                renderSidebar();
                
                if (currentCategory) {
                    const exists = currentDataset.find(c => c.name === currentCategory.name);
                    if (exists) openFolder(exists.name);
                    else clearFolderView();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('statusText').innerText = "Error loading data";
            }
        }

        // Render Sidebar
        function renderSidebar() {
            const container = document.getElementById('folderList');
            container.innerHTML = currentDataset.map(cat => {
                const isActive = currentCategory && currentCategory.name === cat.name ? 'active' : '';
                
                // Determine icon based on system folder or normal folder
                let iconSvg = `<svg class="w-5 h-5 text-sky-400 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>`;
                if (cat.name === "_downloads") {
                    iconSvg = `<svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>`;
                } else if (cat.name === "_database") {
                    iconSvg = `<svg class="w-5 h-5 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>`;
                }
                
                return `
                    <div class="folder-item ${isActive}" onclick="openFolder('${cat.name}')" data-id="${cat.name}">
                        ${iconSvg}
                        <div class="flex-1 truncate text-sm text-slate-200">${cat.display_name || formatLabelName(cat.name)}</div>
                        <div class="text-xs text-slate-500">${cat.videos.length}</div>
                    </div>
                `;
            }).join('');
        }

        function clearFolderView() {
            currentCategory = null;
            selectedIndices.clear();
            lastSelectedIndex = null;
            document.getElementById('currentFolderName').innerText = "Select a folder";
            document.getElementById('selectionStatus').innerText = "";
            document.getElementById('fileGrid').innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center h-full text-slate-500 mt-20">
                    <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <p>Select a label from the sidebar to view files</p>
                </div>
            `;
            renderSidebar();
        }

        // Open Folder
        function openFolder(catId) {
            currentCategory = currentDataset.find(c => c.name === catId);
            selectedIndices.clear();
            lastSelectedIndex = null;
            
            document.getElementById('currentFolderName').innerText = currentCategory.display_name || formatLabelName(catId);
            updateSelectionStatus();
            renderSidebar();
            renderFiles();
            
            document.getElementById('fileExplorer').focus();
        }

        // Render Files
        function renderFiles() {
            const container = document.getElementById('fileGrid');
            if (currentCategory.videos.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-20 text-slate-500">Folder is empty.</div>`;
                return;
            }

            container.innerHTML = currentCategory.videos.map((v, index) => {
                const isSel = selectedIndices.has(index) ? 'selected' : '';
                const fileUrl = v.url || `/media/${currentCategory.name}/${v.filename}`;
                const isVideo = v.filename.match(/\.(mp4|mkv|webm|ts|avi)$/i);
                
                let previewHtml = '';
                if (isVideo) {
                    previewHtml = `<video data-src="${fileUrl}" class="w-full h-full object-contain" preload="metadata"></video>`;
                } else {
                    previewHtml = `<div class="w-full h-full flex items-center justify-center text-slate-600"><svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg></div>`;
                }

                return `
                    <div class="file-item ${isSel}" data-index="${index}" onclick="handleFileClick(event, ${index})" ondblclick="handleMenuAction('preview', ${index})" oncontextmenu="handleContextMenu(event, ${index})">
                        <div class="aspect-video bg-black relative border-b border-slate-700/50 pointer-events-none">
                            ${previewHtml}
                        </div>
                        <div class="p-3">
                            <div class="text-[13px] text-slate-200 font-medium truncate mb-1" title="${v.filename}">${v.filename}</div>
                            <div class="text-[11px] text-slate-500 flex justify-between">
                                <span>${formatBytes(v.size)}</span>
                                <span>${new Date(v.created_at * 1000).toLocaleDateString()}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Observe videos
            container.querySelectorAll('video').forEach(vid => videoObserver.observe(vid));
        }

        // Selection Logic (Windows Explorer Style)
        function handleFileClick(e, index) {
            e.stopPropagation();
            
            if (e.ctrlKey || e.metaKey) {
                // Toggle selection
                if (selectedIndices.has(index)) selectedIndices.delete(index);
                else selectedIndices.add(index);
                lastSelectedIndex = index;
            } else if (e.shiftKey && lastSelectedIndex !== null) {
                // Range selection
                const start = Math.min(lastSelectedIndex, index);
                const end = Math.max(lastSelectedIndex, index);
                selectedIndices.clear();
                for (let i = start; i <= end; i++) {
                    selectedIndices.add(i);
                }
            } else {
                // Single selection
                selectedIndices.clear();
                selectedIndices.add(index);
                lastSelectedIndex = index;
            }
            
            syncSelectionUI();
        }

        function clearSelection(e) {
            // Only clear if clicking on the grid background, not a file
            if (e.target.id === 'fileGrid') {
                selectedIndices.clear();
                lastSelectedIndex = null;
                syncSelectionUI();
            }
        }

        function syncSelectionUI() {
            document.querySelectorAll('.file-item').forEach((item, idx) => {
                if (selectedIndices.has(idx)) item.classList.add('selected');
                else item.classList.remove('selected');
            });
            updateSelectionStatus();
        }

        function updateSelectionStatus() {
            const statusEl = document.getElementById('selectionStatus');
            if (!currentCategory) {
                statusEl.innerText = "";
            } else if (selectedIndices.size === 0) {
                statusEl.innerText = `${currentCategory.videos.length} items`;
            } else {
                statusEl.innerText = `${selectedIndices.size} items selected`;
            }
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (!currentCategory) return;
            
            // Ctrl + A
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                selectedIndices.clear();
                currentCategory.videos.forEach((_, i) => selectedIndices.add(i));
                syncSelectionUI();
            }
            // Delete key
            else if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedIndices.size > 0 && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    handleMenuAction('delete');
                }
            }
        });

        // Context Menu
        const ctxMenu = document.getElementById('contextMenu');
        
        function handleContextMenu(e, index) {
            e.preventDefault();
            
            // If right-clicked item is not in selection, select ONLY it.
            if (!selectedIndices.has(index)) {
                selectedIndices.clear();
                selectedIndices.add(index);
                lastSelectedIndex = index;
                syncSelectionUI();
            }
            
            // Position menu
            ctxMenu.style.display = 'block';
            
            let x = e.pageX;
            let y = e.pageY;
            
            // Prevent overflowing screen
            if (x + ctxMenu.offsetWidth > window.innerWidth) x = window.innerWidth - ctxMenu.offsetWidth;
            if (y + ctxMenu.offsetHeight > window.innerHeight) y = window.innerHeight - ctxMenu.offsetHeight;
            
            ctxMenu.style.left = x + 'px';
            ctxMenu.style.top = y + 'px';
        }

        // Hide context menu on normal click
        document.addEventListener('click', () => {
            ctxMenu.style.display = 'none';
        });

        // Context Menu Actions
        async function handleMenuAction(action, forceIndex = null) {
            ctxMenu.style.display = 'none';
            if (forceIndex !== null) {
                selectedIndices.clear();
                selectedIndices.add(forceIndex);
                syncSelectionUI();
            }
            
            if (selectedIndices.size === 0) return;
            
            const selectedFiles = Array.from(selectedIndices).map(i => currentCategory.videos[i]);

            if (action === 'preview') {
                const v = selectedFiles[0];
                const fileUrl = v.url || `/media/${currentCategory.name}/${v.filename}`;
                
                const isVideo = v.filename.match(/\.(mp4|mkv|webm|ts|avi)$/i);
                if (!isVideo) {
                    // Force download for non-videos like tagger.db
                    const a = document.createElement('a');
                    a.href = fileUrl;
                    a.download = v.filename;
                    a.click();
                    return;
                }

                document.getElementById('previewTitle').innerText = v.filename;
                const vidEl = document.getElementById('previewVideo');
                vidEl.src = fileUrl;
                document.getElementById('previewModal').style.display = 'flex';
                vidEl.play().catch(e => {});
            } 
            else if (action === 'download') {
                // If entire folder selected, download zip (system folders can't be zipped cleanly this way yet, but we allow it for regular labels)
                if (selectedIndices.size === currentCategory.videos.length && currentCategory.videos.length > 1 && !currentCategory.name.startsWith('_')) {
                    window.location.href = `/api/v1/dataset/download_folder/${currentCategory.name}`;
                } else {
                    // Download individual files
                    selectedFiles.forEach(v => {
                        const fileUrl = v.url || `/media/${currentCategory.name}/${v.filename}`;
                        const link = document.createElement('a');
                        link.href = fileUrl;
                        link.download = v.filename;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    });
                }
            }
            else if (action === 'delete') {
                if (!confirm(`Are you sure you want to delete ${selectedFiles.length} item(s)?`)) return;
                try {
                    const promises = selectedFiles.map(v => 
                        fetch(`/api/v1/dataset/${currentCategory.name}/${v.filename}`, { method: 'DELETE' })
                    );
                    await Promise.all(promises);
                    selectedIndices.clear();
                    fetchDataset();
                } catch (e) { alert("Delete failed"); }
            }
            else if (action === 'move') {
                const isSingle = selectedFiles.length === 1;
                document.getElementById('moveModalTitle').innerText = isSingle ? 'Move / Rename' : `Move ${selectedFiles.length} items`;
                document.getElementById('modalCategory').value = currentCategory.name;
                
                if (isSingle) {
                    document.getElementById('renameContainer').style.display = 'block';
                    document.getElementById('modalFilename').value = selectedFiles[0].filename;
                } else {
                    document.getElementById('renameContainer').style.display = 'none';
                }
                document.getElementById('moveModal').style.display = 'flex';
            }
        }

        // Move/Rename Logic
        function closeMoveModal() {
            document.getElementById('moveModal').style.display = 'none';
        }

        function closePreview() {
            const vidEl = document.getElementById('previewVideo');
            vidEl.pause();
            vidEl.src = "";
            document.getElementById('previewModal').style.display = 'none';
        }

        async function submitMove() {
            const new_category = document.getElementById('modalCategory').value.trim();
            if (!new_category) return alert("Destination is required");
            
            const selectedFiles = Array.from(selectedIndices).map(i => currentCategory.videos[i]);
            const isSingle = selectedFiles.length === 1;

            try {
                if (isSingle) {
                    const new_filename = document.getElementById('modalFilename').value.trim();
                    if (!new_filename) return alert("Filename required");
                    const res = await fetch('/api/v1/dataset/move', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ old_category: currentCategory.name, old_filename: selectedFiles[0].filename, new_category, new_filename })
                    });
                    if (!res.ok) throw new Error((await res.json()).detail);
                } else {
                    const promises = selectedFiles.map(v => 
                        fetch('/api/v1/dataset/move', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ old_category: currentCategory.name, old_filename: v.filename, new_category, new_filename: v.filename })
                        }).then(r => { if (!r.ok) throw new Error(); })
                    );
                    await Promise.all(promises);
                }
                closeMoveModal();
                selectedIndices.clear();
                fetchDataset();
            } catch (err) {
                alert("Operation failed: " + err.message);
                fetchDataset();
            }
        }

        // Init
        fetchDataset();
    </script>
</body>
</html>
